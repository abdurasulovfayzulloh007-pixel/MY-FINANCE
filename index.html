<!doctype html>
<html lang="uz">
  <head>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0a1330" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Finora</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        --ac: 37 99 235;
        --ink: 15 23 42;
        --mu: 51 65 85;
        --a: #fff;
        --b: #dbeafe;
        --o1: rgba(96, 165, 250, 0.45);
        --o2: rgba(186, 230, 253, 0.7);
        --g: rgba(255, 255, 255, 0.78);
        --gb: rgba(255, 255, 255, 0.9);
        --sh: 0 8px 30px rgba(37, 99, 235, 0.12);
        --f: rgba(255, 255, 255, 0.8);
        --ok: #059669;
        --bad: #dc2626;
        --warn: #d97706;
      }
      [data-t="dark"] {
        --ac: 34 211 238;
        --ink: 226 240 255;
        --mu: 148 170 199;
        --a: #050d1f;
        --b: #0a1a3a;
        --o1: rgba(14, 116, 255, 0.35);
        --o2: rgba(34, 211, 238, 0.16);
        --g: rgba(15, 30, 62, 0.55);
        --gb: rgba(120, 180, 255, 0.16);
        --sh: 0 8px 30px rgba(0, 0, 0, 0.4);
        --f: rgba(8, 20, 44, 0.7);
        --ok: #34d399;
        --bad: #f87171;
        --warn: #fbbf24;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        font:
          15px/1.4 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: rgb(var(--ink));
        background: linear-gradient(160deg, var(--a), var(--b)) fixed;
        min-height: 100vh;
        padding: 14px 14px calc(96px + env(safe-area-inset-bottom));
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
          radial-gradient(34rem 28rem at 10% 5%, var(--o1), transparent 60%),
          radial-gradient(30rem 26rem at 95% 90%, var(--o2), transparent 60%);
      }
      .g {
        background: var(--g);
        border: 1px solid var(--gb);
        box-shadow: var(--sh);
        -webkit-backdrop-filter: blur(20px) saturate(160%);
        backdrop-filter: blur(20px) saturate(160%);
        border-radius: 22px;
        padding: 16px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 4px;
        font-weight: 600;
        color: rgb(var(--mu));
      }
      h2 {
        font-size: 17px;
        margin: 4px 2px 12px;
      }
      .big {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .mu {
        color: rgb(var(--mu));
        font-size: 13px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .sp {
        justify-content: space-between;
      }
      .c2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .inc {
        color: var(--ok);
      }
      .exp {
        color: var(--bad);
      }
      .item {
        padding: 11px 0;
        border-top: 1px solid var(--gb);
        cursor: pointer;
      }
      .item:first-child {
        border: 0;
      }
      .ic {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: rgb(var(--ac) / 0.14);
        flex: none;
        font-weight: 700;
        color: rgb(var(--ac));
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .grow b,
      .grow span {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .bar {
        height: 9px;
        border-radius: 9px;
        background: rgb(var(--ac) / 0.15);
        overflow: hidden;
        margin: 8px 0 4px;
      }
      .bar i {
        display: block;
        height: 100%;
        border-radius: 9px;
        background: rgb(var(--ac));
        transition: width 0.6s;
      }
      .donut {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        flex: none;
      }
      .donut div {
        width: 78px;
        height: 78px;
        border-radius: 50%;
        background: var(--a);
        display: grid;
        place-items: center;
        font-size: 11px;
        text-align: center;
        color: rgb(var(--mu));
      }
      [data-t="dark"] .donut div {
        background: #08142e;
      }
      input,
      select,
      button {
        font: inherit;
        color: inherit;
      }
      .in {
        width: 100%;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid rgb(var(--ac) / 0.25);
        background: var(--f);
        outline: 0;
        margin: 4px 0 10px;
      }
      .in:focus {
        border-color: rgb(var(--ac));
        box-shadow: 0 0 0 3px rgb(var(--ac) / 0.25);
      }
      label {
        font-size: 13px;
        font-weight: 600;
      }
      .btn {
        width: 100%;
        padding: 13px;
        border: 0;
        border-radius: 14px;
        background: rgb(var(--ac));
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        margin-top: 4px;
      }
      [data-t="dark"] .btn {
        color: #04111f;
      }
      .btn.s {
        background: rgb(var(--ac) / 0.14);
        color: rgb(var(--ac));
      }
      .btn.d {
        background: rgba(220, 38, 38, 0.14);
        color: var(--bad);
      }
      .chips {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
        overflow: auto;
      }
      .chip {
        padding: 8px 14px;
        border-radius: 99px;
        background: var(--g);
        border: 1px solid var(--gb);
        white-space: nowrap;
        cursor: pointer;
      }
      .chip.on {
        background: rgb(var(--ac));
        color: #fff;
        border-color: transparent;
      }
      [data-t="dark"] .chip.on {
        color: #04111f;
      }
      nav {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: calc(10px + env(safe-area-inset-bottom));
        display: flex;
        justify-content: space-around;
        padding: 8px;
        border-radius: 24px;
        z-index: 5;
      }
      nav button {
        background: 0;
        border: 0;
        padding: 6px 8px;
        border-radius: 14px;
        font-size: 11px;
        color: rgb(var(--mu));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        cursor: pointer;
      }
      nav button.on {
        color: rgb(var(--ac));
        background: rgb(var(--ac) / 0.12);
      }
      nav svg {
        width: 22px;
        height: 22px;
      }
      .fab {
        position: fixed;
        right: 20px;
        bottom: calc(92px + env(safe-area-inset-bottom));
        width: 54px;
        height: 54px;
        border-radius: 50%;
        border: 0;
        background: rgb(var(--ac));
        color: #fff;
        font-size: 30px;
        box-shadow: 0 8px 24px rgb(var(--ac) / 0.45);
        z-index: 6;
        cursor: pointer;
      }
      [data-t="dark"] .fab {
        color: #04111f;
      }
      .ov {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 20;
        display: flex;
        align-items: flex-end;
      }
      .sheet {
        width: 100%;
        max-height: 90vh;
        overflow: auto;
        border-radius: 26px 26px 0 0;
        padding: 18px 18px calc(22px + env(safe-area-inset-bottom));
        background: var(--a);
        border: 1px solid var(--gb);
      }
      [data-t="dark"] .sheet {
        background: #0a1a3a;
      }
      .tg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-bottom: 12px;
      }
      .tg button {
        padding: 10px;
        border-radius: 12px;
        border: 1px solid var(--gb);
        background: var(--g);
        cursor: pointer;
        font-weight: 600;
      }
      .tg button.on {
        background: rgb(var(--ac));
        color: #fff;
      }
      [data-t="dark"] .tg button.on {
        color: #04111f;
      }
      .empty {
        text-align: center;
        padding: 26px 10px;
        color: rgb(var(--mu));
      }
      #toast {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 16px;
        border-radius: 14px;
        background: #111c;
        color: #fff;
        z-index: 30;
        display: none;
      }
      :focus-visible {
        outline: 2px solid rgb(var(--ac));
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }

      /* ===== v3: premium dizayn ===== */
      :root {
        --ac2: #0ea5e9;
      }
      [data-t="dark"] {
        --ac2: #3b82f6;
      }
      body {
        font-family:
          "Manrope",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-variant-numeric: tabular-nums;
      }
      body::before {
        animation: drift 22s ease-in-out infinite alternate;
      }
      @keyframes drift {
        to {
          transform: translate3d(-3%, 2%, 0) scale(1.08);
        }
      }
      .g {
        border-radius: 24px;
        box-shadow:
          var(--sh),
          inset 0 1px 0 rgba(255, 255, 255, 0.4);
      }
      [data-t="dark"] .g {
        box-shadow:
          var(--sh),
          inset 0 1px 0 rgba(255, 255, 255, 0.07);
      }
      h2 {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.2px;
      }
      .hero {
        position: relative;
        overflow: hidden;
        border: 0;
        padding: 20px 18px 16px;
        color: #fff;
        background: linear-gradient(135deg, #1e40af, #2563eb 50%, #06b6d4);
        box-shadow:
          0 24px 50px -16px rgba(37, 99, 235, 0.65),
          inset 0 1px 0 rgba(255, 255, 255, 0.4);
      }
      [data-t="dark"] .hero {
        background: linear-gradient(135deg, #0b2a7a, #1458e6 55%, #0e9fc1);
        box-shadow:
          0 24px 50px -16px rgba(34, 211, 238, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.18);
      }
      .hero > * {
        position: relative;
        z-index: 1;
      }
      .hero::before {
        content: "";
        position: absolute;
        width: 280px;
        height: 280px;
        right: -90px;
        top: -120px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.4),
          transparent 65%
        );
        animation: float 9s ease-in-out infinite alternate;
      }

      @keyframes float {
        to {
          transform: translate(-40px, 50px) scale(1.2);
        }
      }
      .hero .mu {
        color: rgba(255, 255, 255, 0.82);
      }
      .hero .big {
        font-size: 37px;
        line-height: 1.1;
        margin-top: 4px;
      }
      .pill {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 10px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.16);
        border: 1px solid rgba(255, 255, 255, 0.25);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        min-width: 0;
      }
      .pill b {
        display: block;
        font-size: 14px;
        white-space: nowrap;
      }
      .pill .mu {
        font-size: 11px;
      }
      .pill u {
        text-decoration: none;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.24);
        flex: none;
        font-weight: 800;
      }
      .av {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(135deg, rgb(var(--ac)), var(--ac2));
        box-shadow: 0 8px 20px -6px rgb(var(--ac) / 0.7);
      }
      [data-t="dark"] .av {
        color: #04111f;
      }
      .ic {
        font-size: 19px;
        background: color-mix(in srgb, var(--c, #2563eb) 20%, transparent);
        color: inherit;
      }
      .big {
        font-weight: 800;
        letter-spacing: -0.8px;
      }
      .bar {
        height: 10px;
      }
      .bar i {
        background: linear-gradient(90deg, rgb(var(--ac)), var(--ac2));
        transform-origin: left;
        animation: gw 1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      @keyframes gw {
        from {
          transform: scaleX(0);
        }
      }
      .gr {
        transform-origin: bottom;
        animation: gr 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      @keyframes gr {
        from {
          transform: scaleY(0);
        }
      }
      .ring {
        width: 66px;
        height: 66px;
        border-radius: 50%;
        flex: none;
        display: grid;
        place-items: center;
        background: conic-gradient(
          rgb(var(--ac)) calc(var(--p) * 1%),
          rgb(var(--ac) / 0.15) 0
        );
      }
      .ring span {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--a);
        font-weight: 800;
        font-size: 13px;
      }
      [data-t="dark"] .ring span {
        background: #0a1a3a;
      }
      .donut div {
        font-weight: 700;
      }
      .btn {
        background: linear-gradient(135deg, rgb(var(--ac)), var(--ac2));
        box-shadow: 0 12px 26px -10px rgb(var(--ac) / 0.7);
        transition:
          transform 0.12s,
          filter 0.15s;
      }
      .btn.s {
        background: rgb(var(--ac) / 0.14);
        box-shadow: none;
      }
      .btn.d {
        background: rgba(220, 38, 38, 0.14);
        box-shadow: none;
      }
      .fab {
        background: linear-gradient(135deg, rgb(var(--ac)), var(--ac2));
        box-shadow: 0 14px 30px -8px rgb(var(--ac) / 0.75);
        transition: transform 0.12s;
      }
      .btn:active,
      .fab:active,
      .chip:active,
      nav button:active,
      .item:active {
        transform: scale(0.96);
      }
      .chip {
        transition:
          transform 0.12s,
          background 0.2s;
      }
      .chip.on {
        background: linear-gradient(135deg, rgb(var(--ac)), var(--ac2));
        box-shadow: 0 8px 18px -8px rgb(var(--ac) / 0.7);
      }
      nav {
        border-radius: 28px;
        padding: 6px;
        box-shadow:
          0 20px 40px -12px rgba(0, 0, 0, 0.35),
          var(--sh);
      }
      nav button {
        flex: 1;
        font-size: 10px;
        font-weight: 600;
        transition:
          color 0.2s,
          background 0.2s,
          transform 0.12s;
        padding: 7px 2px;
      }
      nav button.on {
        background: rgb(var(--ac) / 0.16);
        box-shadow: inset 0 0 0 1px rgb(var(--ac) / 0.28);
      }
      .ov {
        animation: fade 0.2s both;
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
      }
      .sheet {
        animation: slide 0.38s cubic-bezier(0.2, 0.9, 0.25, 1) both;
      }
      .sheet::before {
        content: "";
        display: block;
        width: 40px;
        height: 4px;
        border-radius: 4px;
        background: rgb(var(--mu) / 0.4);
        margin: -6px auto 14px;
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
      }
      @keyframes slide {
        from {
          transform: translateY(100%);
        }
      }
      .pg > * {
        animation: up 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .pg > *:nth-child(2) {
        animation-delay: 0.05s;
      }
      .pg > *:nth-child(3) {
        animation-delay: 0.1s;
      }
      .pg > *:nth-child(4) {
        animation-delay: 0.15s;
      }
      .pg > *:nth-child(5) {
        animation-delay: 0.2s;
      }
      .pg > *:nth-child(n + 6) {
        animation-delay: 0.25s;
      }
      @keyframes up {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
      }
      /* ===== v4: dizayn ===== */
      :root {
        --r: 20px;
      }
      .hero {
        border-radius: 30px;
        padding: 24px 20px 18px;
        background:
          radial-gradient(rgba(255, 255, 255, 0.13) 1px, transparent 1.5px) 0
            0/14px 14px,
          linear-gradient(135deg, #1e3a8a, #2563eb 45%, #06b6d4);
      }
      [data-t="dark"] .hero {
        background:
          radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1.5px) 0
            0/14px 14px,
          linear-gradient(135deg, #0b2a7a, #1458e6 55%, #0e9fc1);
      }
      .hero .big {
        font-size: 42px;
        letter-spacing: -1.5px;
        text-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
      }
      .item {
        padding: 11px 8px;
        margin: 0 -8px;
        border-radius: 14px;
        transition:
          background 0.2s,
          transform 0.12s;
      }
      .item:hover {
        background: rgb(var(--ac) / 0.07);
      }
      .dh + .item {
        border: 0;
      }
      .ic {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        box-shadow: inset 0 0 0 1px
          color-mix(in srgb, var(--c, #2563eb) 30%, transparent);
      }
      .dh {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        color: rgb(var(--mu));
        margin: 12px 0 2px;
      }
      .dh:first-child {
        margin-top: 0;
      }
      .rec {
        font-style: normal;
        font-size: 11px;
        margin-left: 6px;
      }
      .mnav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0 0 12px;
        padding: 6px;
        border-radius: 20px;
        background: var(--g);
        border: 1px solid var(--gb);
        box-shadow: var(--sh);
      }
      .mnav b {
        font-size: 16px;
        font-weight: 800;
      }
      .mnav button {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        border: 0;
        background: rgb(var(--ac) / 0.14);
        color: rgb(var(--ac));
        font-size: 24px;
        cursor: pointer;
        transition: transform 0.12s;
      }
      .mnav button:active {
        transform: scale(0.9);
      }
      .mnav button:disabled {
        opacity: 0.3;
      }
      .dl {
        padding: 4px 11px;
        border-radius: 99px;
        font-weight: 800;
        font-size: 13px;
        background: rgb(var(--mu) / 0.14);
      }
      .dl.gd {
        background: rgba(16, 185, 129, 0.16);
        color: var(--ok);
      }
      .dl.bd {
        background: rgba(239, 68, 68, 0.16);
        color: var(--bad);
      }
      nav button.on::after {
        content: "";
        width: 16px;
        height: 3px;
        border-radius: 3px;
        background: rgb(var(--ac));
        margin-top: 1px;
      }
      .in {
        border-radius: 16px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      textarea.in {
        resize: vertical;
      }
      .donut {
        box-shadow: 0 14px 30px -12px rgb(var(--ac) / 0.55);
      }
      .fab {
        box-shadow:
          0 14px 30px -8px rgb(var(--ac) / 0.75),
          0 0 0 7px rgb(var(--ac) / 0.12);
      }
      .empty {
        line-height: 1.6;
      }
      #toast {
        border-radius: 99px;
        padding: 11px 18px;
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.3);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        animation: tin 0.3s both;
      }
      @keyframes tin {
        from {
          opacity: 0;
          transform: translate(-50%, -14px);
        }
      }
      /* ===== v5: tuzatishlar + dizayn ===== */
      body {
        padding-bottom: calc(150px + env(safe-area-inset-bottom));
      }
      body::after {
        content: "";
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 130px;
        background: linear-gradient(
          transparent,
          color-mix(in srgb, var(--b) 92%, transparent)
        );
        pointer-events: none;
        z-index: 4;
      }
      .fab {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        right: 18px;
        bottom: calc(102px + env(safe-area-inset-bottom));
        transition:
          transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1),
          opacity 0.25s;
      }
      .fab.hide {
        transform: translateY(130px) scale(0.6);
        opacity: 0;
        pointer-events: none;
      }
      nav {
        background: color-mix(in srgb, var(--a) 80%, transparent);
        -webkit-backdrop-filter: blur(26px) saturate(180%);
        backdrop-filter: blur(26px) saturate(180%);
      }
      .c2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-bottom: 12px;

              if (t.cat == n) t.cat = nn;
            });
            if (S.b[n] != null) {
              S.b[nn] = S.b[n];
              delete S.b[n];
            }
          }
          const v = { n: nn, t: ty, i: ic, c: co };
          S.x = (S.x || []).filter((z) => z != "c:" + nn);
          S.c = c ? S.c.map((x) => (x.n == n ? v : x)) : [...S.c, v];
          syncCats();
          save();
          close();
          render();
          toast("Saqlandi");
        };
        if (c)
          $("#cx").onclick = async () => {
            if (
              await ask(
                "Kategoriya o'chiriladi (yozuvlar qoladi). Davom etasizmi?",
              )

              tomb("c:" + n);
              S.c = S.c.filter((x) => x.n != n);
              syncCats();
              save();
              close();
              render();
            }
          };
      }
      /* ===== zaxira tekshiruvi, yengil rejim, qurilmalar sinxronligi ===== */
      const dOk = (x) =>
        typeof x == "string" &&
        /^\d{4}-\d\d-\d\d$/.test(x) &&
        !isNaN(Date.parse(x));
      function sane(o) {
        let bad = 0;
        const str = (x) => typeof x == "string",
          ty = (x) => x == "in" || x == "out",
          num = (x) => typeof x == "number" && isFinite(x) && x > 0,
          seen = new Set();
        const f = (a, p) =>
          (Array.isArray(a) ? a : []).filter(
            (x) => (x && typeof x == "object" && p(x)) || (bad++, false),
          );
        o.t = f(
          o.t,
          (x) =>
            str(x.id) &&
            !seen.has(x.id) &&
            seen.add(x.id) &&
            ty(x.type) &&
            num(x.amt) &&
            str(x.cat) &&
            dOk(x.d),
        );
        o.t.forEach((x) => {
          x.note = str(x.note) ? x.note.slice(0, 200) : "";
          x.ts = +x.ts || 0;
        });
        o.g = f(
          o.g,
          (x) =>
            str(x.id) &&
            str(x.name) &&
            num(x.target) &&
            typeof x.saved == "number" &&
            x.saved >= 0 &&
            isFinite(x.saved) &&
            (!x.date || dOk(x.date)),
        );
        o.r = f(
          o.r,
          (x) =>
            str(x.id) &&
            ty(x.type) &&
            num(x.amt) &&
            str(x.cat) &&
            x.day >= 1 &&
            x.day <= 31 &&
            dOk(x.start),
        );
        o.c = f(
          o.c,
          (x) =>
            str(x.n) &&
            x.n.length <= 24 &&
            ty(x.t) &&
            str(x.i) &&
            x.i.length <= 8 &&
            !/[<>&"']/.test(x.i) &&
            /^#[0-9a-f]{6}$/i.test(x.c),
        );
        Object.keys(o.b).forEach((k) => {
          if (!num(o.b[k])) {
            delete o.b[k];
            bad++;
          }
        });
        o.x = (Array.isArray(o.x) ? o.x : []).filter(str);
        o.th = ["light", "dark"].includes(o.th) ? o.th : null;
        o.lang = ["uz", "ru", "en"].includes(o.lang) ? o.lang : undefined;
        if (isNaN(Date.parse(o.created))) o.created = new Date().toISOString();
        return { o, bad };
      }
      Object.assign(D, {
        "Yengil rejim (animatsiyasiz)": {
          ru: "Лёгкий режим (без анимаций)",
          en: "Lite mode (no animations)",
        },
        "Sekin telefonlar uchun: fon animatsiyasi va xiralashtirish o'chiriladi.":
          {
            ru: "Для слабых телефонов: отключает анимации и размытие.",

      const SUN =

      };
      Object.assign(D, {
        Til: { ru: "Язык", en: "Language" },
        Mavzu: { ru: "Тема", en: "Theme" },
        "Yengil rejim": { ru: "Лёгкий режим", en: "Lite mode" },
      });
      Object.assign(D, {
        Kutilmoqda: { ru: "Ожидают", en: "Pending" },
        "Yaqinda (7 kun)": { ru: "Скоро (7 дней)", en: "Coming up (7 days)" },
        "To'landi ✓": { ru: "Оплачено ✓", en: "Paid ✓" },
        "O'tkazish": { ru: "Пропустить", en: "Skip" },
        "O'tkazib yuborildi": { ru: "Пропущено", en: "Skipped" },
        Ertaga: { ru: "Завтра", en: "Tomorrow" },
        "Har kun": { ru: "Каждый день", en: "Daily" },
        "Har hafta": { ru: "Каждую неделю", en: "Weekly" },
        "Har oy": { ru: "Каждый месяц", en: "Monthly" },
        "Har yil": { ru: "Каждый год", en: "Yearly" },
        Takrorlanishi: { ru: "Повтор", en: "Repeat" },
        "Necha marta (ixtiyoriy)": {

        "Ijara, internet, maosh kabilarni bir marta kiriting.": {

          en: "Enter rent, internet or salary once.",
        },
      });
      P.push([
        /^(\d+) kun qoldi$/,
        { ru: "Осталось дней: $1", en: "$1 days left" },

      const V = {
        rep: vRep,
        home: vHome,
        list: vList,
        pig: vPig,
        tgt: vBud,
        more: vMore,
      };
      function render() {
        nav();
        $("#app").innerHTML = V[tab]();
        document.querySelectorAll("[data-count]").forEach(countUp);
        const cfi = $("#cf");
        if (cfi) {
          cfi.onchange = (e) => {

            render();

      function sheet(h) {
        close();
        const o = document.createElement("div");
        o.className = "ov";
        o.innerHTML = `<div class="sheet">${h}</div>`;
        o.onclick = (e) => {
          if (e.target == o) close();
        };
        document.body.append(o);
        swipe(o);
        try {
          tg.BackButton.show();
        } catch (_) {}
      }
      function close() {
        document.querySelectorAll(".ov").forEach((o) => o.remove());
        try {
          tg.BackButton.hide();
        } catch (_) {}
      }
      const opt = (a, v) =>
        a
          .map(
            (x) =>
              `<option value="${esc(x)}" ${x == v ? "selected" : ""}>${esc(x)}</option>`,
          )
          .join("");
      function txForm(id) {
        const x = S.t.find((t) => t.id == id) || {
          type: "out",
          d: today(),
          cat: "",
          amt: "",
          note: "",
        };
        let ty = x.type,
          cat = x.cat;
        const draw = () => {
          const cs = ty == "in" ? INC : EXP;
          if (!cs.includes(cat)) cat = cs[0];
          $(".tf").dataset.k = ty;
          $("#tcg").innerHTML = cs
            .map(
              (c) =>
                `<button type="button" class="cc${c == cat ? " on" : ""}" data-c="${esc(c)}" style="--c:${catCol(c)}"><i>${catIc(c)}</i><span>${esc(c)}</span></button>`,
            )
            .join("");
          $("#tcg")
            .querySelectorAll("[data-c]")
            .forEach(
              (b) =>
                (b.onclick = () => {
                  cat = b.dataset.c;
                  draw();
                }),
            );
        };
        sheet(`<div class="tf" data-k="${ty}"><h2>${id ? "Tahrirlash" : "Yangi tranzaksiya"}</h2><div class="tg"><button data-ty="out" class="${ty == "out" ? "on" : ""}">Chiqim</button><button data-ty="in" class="${ty == "in" ? "on" : ""}">Kirim</button></div>
 <div class="amt"><input class="in" id="ta" inputmode="numeric" placeholder="0" autocomplete="off" value="${x.amt}"><span>so'm</span></div>
 <label>Kategoriya</label><div class="cg" id="tcg"></div>
 <div class="c2"><div><label>Sana</label><input class="in" id="td" type="date" value="${x.d}"></div><div><label>Izoh</label><input class="in" id="tn" maxlength="200" value="${esc(x.note)}"></div></div>
 <button class="btn" id="ts">Saqlash</button>${id ? '<button class="btn d" id="tx">O\'chirish</button>' : ""}</div>`);
        draw();
        document.querySelectorAll("[data-ty]").forEach(
          (b) =>
            (b.onclick = () => {
              ty = b.dataset.ty;
              document
                .querySelectorAll("[data-ty]")
                .forEach((z) => z.classList.toggle("on", z == b));
              draw();
            }),
        );
        if (!id) setTimeout(() => $("#ta") && $("#ta").focus(), 280);
        $("#ts").onclick = () => {
          const amt = +$("#ta").value.replace(/\s/g, "").replace(",", "."),
            d = $("#td").value;
          if (!(amt > 0)) {
            const q = $("#ta");
            q.classList.remove("shake");
            void q.offsetWidth;
            q.classList.add("shake");
            return toast("Summani to'g'ri kiriting.");
          }
          if (!d) return toast("Sanani tanlang.");
          const r = {
            id: id || uid(),
            type: ty,
            amt,
            cat,
            d,
            note: $("#tn").value.trim(),
            ts: x.ts || Date.now(),
            rid: x.rid,
          };
          if (id) S.t = S.t.map((t) => (t.id == id ? r : t));
          else S.t.push(r);
          save();
          close();
          render();
          toast("Saqlandi");
        };
        if (id)
          $("#tx").onclick = async () => {
            if (await ask("Bu yozuvni o'chirasizmi?")) {
              tomb(id);
              S.t = S.t.filter((t) => t.id != id);
              save();
              close();
              render();
            }
          };
      }
      function goalForm() {
        sheet(
          `<h2>Yangi maqsad</h2><label>Nomi</label><input class="in" id="gn" maxlength="60" placeholder="MacBook sotib olish"><label>Maqsad summasi (so'm)</label><input class="in" id="gt" inputmode="numeric"><label>Muddat (ixtiyoriy)</label><input class="in" id="gd" type="date"><button class="btn" id="gs">Yaratish</button>`,
        );
        $("#gs").onclick = () => {
          const n = $("#gn").value.trim(),
            t = +$("#gt").value.replace(/\s/g, "");
          if (!n) return toast("Nomini kiriting.");
          if (!(t > 0)) return toast("Summani kiriting.");
          S.g.push({
            id: uid(),
            name: n,
            target: t,
            saved: 0,
            date: $("#gd").value,
          });
          save();
          close();
          render();
        };
      }
      function goalMoney(id) {
        const g = S.g.find((x) => x.id == id);
        sheet(
          `<h2>${esc(g.name)}</h2><div class="mu">Jamg'arilgan: ${fmt(g.saved)} · Qoldi: ${fmt(Math.max(0, g.target - g.saved))}</div><label style="display:block;margin-top:12px">Summa (so'm)</label><input class="in" id="ga" inputmode="numeric"><button class="btn" id="gi">Qo'shish</button><button class="btn s" id="go">Yechib olish</button><button class="btn d" id="gx">Maqsadni o'chirish</button>`,
        );
        const get = () => +$("#ga").value.replace(/\s/g, "");
        $("#gi").onclick = () => {
          const a = get();
          if (!(a > 0)) return toast("Summani kiriting.");
          if (a > stats().bal) return toast("Balansda mablag' yetarli emas.");
          g.saved += a;
          save();
          close();
          render();
        };
        $("#go").onclick = () => {
          const a = get();
          if (!(a > 0)) return toast("Summani kiriting.");
          if (a > g.saved) return toast("Maqsadda bunchalik mablag' yo'q.");
          g.saved -= a;
          save();
          close();
          render();
        };
        $("#gx").onclick = async () => {
          if (
            await ask(
              "Maqsad o'chiriladi, jamg'arilgan summa balansga qaytadi. Davom etasizmi?",
            )
          ) {
            tomb(id);
            S.g = S.g.filter((x) => x.id != id);
            save();
            close();
            render();
          }
        };
      }
      function budForm(c) {
        sheet(
          `<h2>${esc(c)} — oylik limit</h2><label>Limit (so'm)</label><input class="in" id="bl" inputmode="numeric" value="${S.b[c] || ""}"><button class="btn" id="bs">Saqlash</button>${S.b[c] ? '<button class="btn d" id="bd">Limitni olib tashlash</button>' : ""}`,
        );
        $("#bs").onclick = () => {
          const v = +$("#bl").value.replace(/\s/g, "");
          if (!(v > 0)) return toast("Limitni kiriting.");
          S.b[c] = v;
          save();
          close();
          render();
        };
        if (S.b[c])
          $("#bd").onclick = () => {
            delete S.b[c];
            save();
            close();
            render();
          };
      }
      document.addEventListener("click", async (e) => {
        const t = e.target.closest(
          "[data-tab],[data-f],[data-edit],[data-goal],[data-bud],[data-p],[data-act],[data-rule],[data-m],[data-lang],[data-cat]",
        );
        if (!t) return;
        try {
          tg.HapticFeedback.impactOccurred("light");
        } catch (_) {}
        const d = t.dataset;
        if (d.tab) {
          tab = d.tab;
          render();
          pg();
          scrollTo(0, 0);
        } else if (d.f) {
          flt = d.f;
          render();
        } else if (d.edit) txForm(d.edit);
        else if (d.goal) goalMoney(d.goal);
        else if (d.bud) budForm(d.bud);
        else if (d.p) {
          per = d.p;
          render();
        } else if (d.lang) {
          S.lang = d.lang;
          document.documentElement.lang = d.lang;
          save();
          render();
          trn(document.body);
        } else if (d.cat) catForm(d.cat);
        else if (d.act == "newcat") catForm();
        else if (d.rule) recForm(d.rule);
        else if (d.m) {
          vm = mshift(vm, +d.m);
          if (vm > cm()) vm = cm();
          render();
        } else if (d.act == "more") {
          lim += 60;
          render();
        } else if (d.act == "newrule") recForm();
        else if (d.act == "bak") dlBak();
        else if (d.act == "cpbak") cp(bak(), "Zaxira nusxalandi");
        else if (d.act == "imp") impForm();
        else if (d.act == "newgoal") goalForm();
        else if (d.act == "exp") dlCsv();
        else if (d.act == "cp") cpCsv();
        else if (d.act == "lite") {
          try {
            localStorage.setItem("mf_lite", liteOn() ? "0" : "1");
          } catch (_) {}
          theme();
          render();
        } else if (d.act == "pok" || d.act == "psk") {
          payDo(d.k, d.act);
        } else if (d.act == "ped") {
          payEdit(d.k);
        } else if (d.act == "sgy" || d.act == "sgn") {
          sgDo(d.k, d.act);
        } else if (d.act == "profile") {
          profForm();
        } else if (d.act == "lang") {
          const L = ["uz", "ru", "en"];
          S.lang = L[(L.indexOf(S.lang || "uz") + 1) % 3];
          document.documentElement.lang = S.lang;
          save();
          render();
          trn(document.body);
        } else if (d.act == "theme") {
          S.th =
            document.documentElement.dataset.t == "dark" ? "light" : "dark";
          save();
          theme();
          render();
        } else if (
          d.act == "reset" &&
          (await ask(
            "BARCHA ma'lumotlar o'chiriladi. Qaytarib bo'lmaydi. Davom etasizmi?",
          ))
        ) {
          S = null;
          try {
            localStorage.removeItem("mf_bak");
          } catch (_) {}
          await kv.del(
            Array.from({ length: prevN }, (_, i) => "mf_" + i).concat("mf_n"),
          );
          await load();
          theme();
          render();
        }
      });
      let ly = 0;
      addEventListener(
        "scroll",
        () => {
          const y = scrollY;
          $("#fab").classList.toggle("hide", y > ly && y > 80);
          ly = y;

        { passive: true },
      );
      $("#fab").onclick = () => {
        try {
          tg.HapticFeedback.impactOccurred("medium");
        } catch (_) {}
        txForm();

      if ("serviceWorker" in navigator && location.protocol === "https:")
        navigator.serviceWorker.register("sw.js").catch(() => {});
      load().then(() => {
        theme();
        lang0();
        runRec();
        render();
        pg();
        trn(document.body);
        if (!lock && !S.name && !S.asked && !tgUser()) {
          S.asked = 1;
          save();
          setTimeout(profForm, 700);
        }
        if (lock)
          setTimeout(async () => {
            await load();
            runRec();
            render();
            if (lock) recover();
          }, 1500);
      });
